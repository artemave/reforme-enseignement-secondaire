name: Synchronise and publish
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
  discussion:
  discussion_comment:
    types: [created, edited, deleted]
  milestone:
  label:
  release:
    types: [published, edited, deleted]
  page_build:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
# All writers/deployments share one lock. Pending runs can coalesce safely because
# every run fetches current state, rather than applying an event delta.
concurrency:
  group: document-pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    if: >-
      !((github.event_name == 'discussion_comment') && github.event.comment.user.login == 'github-actions[bot]' && startsWith(github.event.comment.body, '<!-- document-annotations:v1 -->')) &&
      (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == github.event.repository.default_branch)) &&
      (github.event_name != 'page_build' || github.event.build.pusher.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      discussions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DOCUMENT_BRANCH: ${{ github.event.repository.default_branch }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4.1-mini' }}
      AI_ENDPOINT: ${{ vars.AI_ENDPOINT || 'https://api.openai.com/v1/chat/completions' }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      # Always publish the current default-branch document and trusted site code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
