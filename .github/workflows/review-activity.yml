name: Review activity
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
permissions: {}
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      # Fork review events cannot access secrets. This unprivileged signal causes
      # the workflow_run publisher to fetch fresh state from the default branch.
      # No PR code, event payload, or artifacts are passed to the publisher.
      - run: 'true'
