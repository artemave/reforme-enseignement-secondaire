<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>try{const theme=localStorage.getItem("theme");if(theme==="light"||theme==="dark")document.documentElement.dataset.theme=theme}catch{}</script>
  <link rel="stylesheet" href="/src/style.css" />
  <meta name="description" content="Un document de travail ouvert à la discussion. Retrouvez les questions et propositions liées à chaque passage." />
  <script type="module" src="/src/main.ts"></script>
  <title>Réforme de l’enseignement secondaire</title>
</head>
<body>
  <a class="skip" href="#document">Aller au document</a>
  <header class="site-header" hidden><div class="page-frame"><details class="contents"><summary aria-label="Sommaire"><span aria-hidden="true">☰</span></summary><nav id="contents" aria-label="Sommaire"></nav></details></div></header>
  <div class="workspace">
    <main id="document"><div class="document-meta"><span class="status-dot" aria-hidden="true"></span><span id="updated"></span></div><p class="invitation">Document de travail ouvert à la discussion. Touchez la bulle <svg class="invitation-bubble" viewBox="0 0 44 44" aria-hidden="true"><path d="M15 7H29Q38 7 38 16V27Q38 36 29 36H22L15 41V36Q6 36 6 27V16Q6 7 15 7Z" /></svg> à côté d’un passage pour lire les échanges ou donner votre avis. <a id="invitation-help" href="./comment-ca-marche/">Comment ça marche</a></p><div id="units"><p role="status">Chargement du document…</p></div></main>

  </div>
  <footer class="document-footer"><div class="page-frame footer-controls"><a id="how-it-works" href="./comment-ca-marche/">Comment ça marche</a><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Activer le mode sombre">☾</button></div></footer>
  <section id="annotations" class="passage-discussions" aria-labelledby="panel-title" hidden><h2 id="panel-title"></h2><div class="panel-content"><nav id="items" aria-label="Autres discussions"></nav><div id="thread" class="giscus"></div></div></section>
</body>
</html>
