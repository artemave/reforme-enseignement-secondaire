<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Un document de travail ouvert à la discussion. Retrouvez les questions et propositions liées à chaque passage." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <title>Réforme de l’enseignement secondaire</title>
</head>
<body>
  <a class="skip" href="#document">Aller au document</a>
  <header class="site-header"><details class="contents page-frame"><summary aria-label="Sommaire"><span aria-hidden="true">☰</span></summary><nav id="contents" aria-label="Sommaire"></nav></details></header>
  <div class="workspace">
    <main id="document" tabindex="-1"><div class="document-meta"><span class="status-dot" aria-hidden="true"></span><span id="updated"></span></div><div id="units"><p role="status">Chargement du document…</p></div></main>

  </div>
  <footer class="document-footer"><div class="page-frame"><a id="repository" href="https://github.com/artemave/reforme-enseignement-secondaire">Voir sur GitHub <span aria-hidden="true">↗</span></a></div></footer>
  <dialog id="annotations" aria-labelledby="panel-title"><div class="panel-header"><span>Autour de ce passage</span><button id="close-panel" type="button" aria-label="Fermer" autofocus>×</button></div><h2 id="panel-title"></h2><div class="panel-content"><blockquote id="passage"></blockquote><div id="items"></div></div><div class="contribute"><h3>Faire avancer le texte</h3><a id="new-issue" class="primary" href="https://github.com">Ouvrir une discussion ↗</a><a id="new-pr" href="https://github.com">Proposer une modification ↗</a></div></dialog>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
